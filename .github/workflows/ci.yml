name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        working-directory: backend
        run: uv sync

      - name: Ruff 静态检查
        working-directory: backend
        run: uv run ruff check src tests

      - name: Pytest 单元测试（FakeChatModel，零 API 成本）
        working-directory: backend
        run: uv run pytest tests/unit
